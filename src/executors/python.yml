description: >
  An Ubuntu based image built by CircleCI with CI/CD in mind. This image contains basic tools and the Python runtime.

parameters:
  tag:
    type: string
    default: "3.11"
    description: >
      What version of the cimg/python image? For full list, see
      https://circleci.com/developer/images/image/cimg/python
  resource_class:
    description: Configure the executor resource class
    type: enum
    enum: ["small", "small.gen2", "medium", "medium.gen2", "medium+", "medium+.gen2", "large", "large.gen2", "xlarge", "xlarge.gen2", "2xlarge", "2xlarge.gen2", "2xlarge+", "2xlarge+.gen2"]
    default: "medium"

resource_class: << parameters.resource_class >>
docker:
  - image: cimg/python:<< parameters.tag >>
