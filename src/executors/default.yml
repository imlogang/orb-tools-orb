description: >
  The circleci-cli Docker image, which includes the CircleCI CLI executable.

parameters:
  tag:
    type: string
    default: "latest"
    description: >
      What version of the CircleCI CLI Docker image? For full list, see
      https://hub.docker.com/r/circleci/circleci-cli/tags
  resource_class:
    description: Configure the executor resource class
    type: enum
    enum: ["small", "small.gen2", "medium", "medium.gen2", "medium+", "medium+.gen2", "large", "large.gen2", "xlarge", "xlarge.gen2", "2xlarge", "2xlarge.gen2", "2xlarge+", "2xlarge+.gen2"]
    default: "medium"

resource_class: << parameters.resource_class >>
docker:
  - image: circleci/circleci-cli:<< parameters.tag >>
